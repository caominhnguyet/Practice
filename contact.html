<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CONTACT</title>

    <style>

        body {
            margin: 0;
            background-color: #f8f5fa;
        }

        /* CONTACT US */
        .contact {
            width: 100%;
            text-align: center;
        }

        .contact h1 {
            font-size: 80px;
            font-family: 'Courier New', Courier, monospace;
            color: #71A2D9;

            margin: 40px 0 80px;

            font-weight: bold;
            letter-spacing: 3px;
        }

        /* CONTACT CARD */
        .contact-card {
            width: 82%;
            max-width: 960px;
            min-height: 410px;

            margin: 0 auto;

            background-color: white;

            border: 2px solid #71A2D9;
            border-radius: 25px;

            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding: 40px;
            box-sizing: border-box;
        }

        /* CARD TITLE */
        .contact-card h2 {
            font-size: 38px;
            font-family: 'Franklin Gothic Medium',
                         'Arial Narrow',
                         Arial,
                         sans-serif;

            color: #71A2D9;

            margin: 0 0 35px;

            font-weight: bold;
        }

        /* CONTACT INFORMATION */
        .contact-card p {
            width: 500px;

            font-size: 28px;

            font-family: Arial, sans-serif;

            margin: 8px 0;

            color: #222;

            text-align: left;
        }

        /* LABEL */
        .contact-card strong {
            color: #71A2D9;

            display: inline-block;

            width: 120px;

            margin-right: 10px;
        }

    </style>

</head>

<body>

    <section class="contact">

        <h1>CONTACT US</h1>

    </section>


    <div class="contact-card">

        <h2>PLEASE FEEL FREE TO CONTACT</h2>

        <p>
            <strong>Phone:</strong>
            <span>+84 373 158 868</span>
        </p>

        <p>
            <strong>Mail:</strong>
            <span>minhminofficial@gmail.com</span>
        </p>

    </div>

</body>
</html>
